name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Stable Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Kernels come from the artifacts saved beside their sources, which must be current.
    env:
      METAL_OXIDE_ARTIFACTS: locked
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Install nextest
        uses: taiki-e/install-action@3a0adc33ab45d7b9b9da91822dd2b3c0151704be # nextest
        with:
          tool: nextest@0.9.148
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Unit tests only in tests.rs modules
        if: runner.os == 'Linux'
        run: |
          ! grep -rnE '^[[:space:]]*(#\[test\]|mod tests \{)' crates benchmarks examples --include='*.rs' | grep -vE '/tests/|/(tests|loom)\.rs:'
      - name: Check capability reference
        run: cargo run -p metal-oxide-artifact --example capabilities --locked -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Portable tests
        # The ci profile prints each finished test with a running (N/total) counter.
        run: cargo nextest run --workspace --profile ci --locked
      - name: Compile-fail and documentation examples
        run: cargo test --workspace --doc --locked
      - name: Loom models of cross-thread runtime state
        if: runner.os == 'macOS'
        run: RUSTFLAGS="--cfg loom" cargo nextest run -p metal-oxide --lib --release --profile ci --locked --target-dir target/loom loom
      - name: Minimum supported Rust
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --workspace --all-targets --locked
      - name: Benchmark driver
        run: python3 scripts/test_bench.py
      - name: Fuzz issue reporter
        if: runner.os == 'Linux'
        run: python3 scripts/test_report_fuzz_failure.py

  dependencies:
    name: Dependency licenses, advisories and sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          rust-version: "1.99.0"

  miri:
    name: Miri on host code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Miri
        run: rustup toolchain install nightly-2026-10-04 --profile minimal --component miri --component rust-src
      - name: Artifact contracts and layouts
        run: cargo +nightly-2026-10-04 miri test --locked -p metal-oxide-artifact
      - name: Launch validation and value encoding
        # The Metal module is absent on Linux, and trybuild runs Cargo, which Miri cannot.
        run: cargo +nightly-2026-10-04 miri test --locked -p metal-oxide --lib --test values --test half

  compiler:
    name: Rust compiler (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, macos-26]
    defaults:
      run:
        working-directory: crates/metal-oxide-compiler
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install compiler and workspace toolchains
        # Generated-host tests build with the workspace toolchain; installing it here avoids
        # concurrent rustup installs from parallel tests.
        run: |
          rustup toolchain install nightly-2026-10-04 --profile minimal --component rustc-dev --component rust-src --component llvm-tools --component clippy --component rustfmt
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
      - name: Install nextest
        uses: taiki-e/install-action@3a0adc33ab45d7b9b9da91822dd2b3c0151704be # nextest
        with:
          tool: nextest@0.9.148
      - name: Compiler Clippy
        run: cargo clippy --features rustc-private --all-targets --locked --target-dir ../../target/compiler -- -D warnings
      - name: Frontend, IR, and MSL tests
        run: cargo nextest run --features rustc-private --profile ci --locked --target-dir ../../target/compiler
      - name: Inspect kernels through Cargo
        if: runner.os == 'macOS'
        working-directory: .
        run: |
          for package in vec-add saxpy reduction matmul pipeline; do
            cargo run -p cargo-metal --locked -- inspect --emit msl -p "$package" --locked
          done

  setup:
    name: Setup and an application (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install cargo-metal and set up the kernel toolchain
        run: |
          cargo install --locked --path crates/cargo-metal --root "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tools/bin/cargo-metal" metal setup
      - name: Test an application with plain Cargo and with validation
        working-directory: tests/installed
        run: |
          cargo test -- --ignored
          cargo metal test --validate -- --ignored

  gpu:
    name: GPU suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install compiler, workspace and minimum supported toolchains
        # The embedded-library test builds its host on the minimum supported Rust.
        run: |
          rustup toolchain install nightly-2026-10-04 --profile minimal --component rustc-dev --component rust-src --component llvm-tools
          rustup toolchain install 1.99.0 --profile minimal
          rustup toolchain install 1.89.0 --profile minimal
      - name: Install nextest
        uses: taiki-e/install-action@3a0adc33ab45d7b9b9da91822dd2b3c0151704be # nextest
        with:
          tool: nextest@0.9.148
      - name: Report the toolchain and the Metal device
        run: cargo run -p cargo-metal --locked -- setup --check
      - name: Classic Metal kernels and artifacts
        # The hosted Apple Paravirtual device lacks the Metal 4 family.
        run: bash scripts/test-gpu.sh classic
