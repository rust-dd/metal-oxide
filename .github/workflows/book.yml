name: Book and API documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Each main commit has its own group, so a later push never cancels or drops its runs.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      METAL_OXIDE_ARTIFACTS: locked
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Check generated capabilities
        run: cargo run -p metal-oxide-artifact --example capabilities --locked -- --check
      - name: Check source includes and summary
        run: python3 scripts/check-book.py --source-only
      - name: Build book
        run: mdbook build book
      - name: Check internal links
        run: python3 scripts/check-book.py
      - name: Build API documentation without warnings
        run: cargo doc --locked --no-deps -p metal-oxide -p metal-oxide-device -p metal-oxide-macros -p metal-oxide-kernels -p metal-oxide-build
      - name: Upload book for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  publish:
    if: github.event_name == 'release'
    needs: documentation
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish release book
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
