name: Fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Starting seed as a decimal u64; empty uses the clock"
        type: string
        default: ""
      seconds:
        description: "Time budget in seconds"
        type: number
        default: 2700
      shrink_seconds:
        description: "Time budget for minimizing each failure"
        type: number
        default: 600

permissions:
  contents: read

env:
  # The hosted Apple Paravirtual device lacks the Metal 4 family.
  METAL_OXIDE_BACKEND: classic

jobs:
  fuzz:
    name: Generated programs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    defaults:
      run:
        working-directory: crates/metal-oxide-compiler
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install compiler and workspace toolchains
        run: |
          rustup toolchain install nightly-2026-10-04 --profile minimal --component rustc-dev --component rust-src --component llvm-tools
          rustup toolchain install 1.99.0 --profile minimal
      - name: Install nextest
        uses: taiki-e/install-action@3a0adc33ab45d7b9b9da91822dd2b3c0151704be # nextest
        with:
          tool: nextest@0.9.148
      - name: Compare retained regressions on classic Metal
        run: cargo nextest run --features rustc-private --locked --target-dir ../../target/compiler --profile gpu --test differential --run-ignored only --no-capture
      - name: Compare generated programs on the CPU, the host and classic Metal
        env:
          METAL_OXIDE_FUZZ_GPU: "1"
          METAL_OXIDE_FUZZ_SEED: ${{ inputs.seed }}
          METAL_OXIDE_FUZZ_SECONDS: ${{ inputs.seconds || '2700' }}
          METAL_OXIDE_FUZZ_SHRINK_SECONDS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.shrink_seconds) || '600' }}
        run: cargo nextest run --features rustc-private --locked --target-dir ../../target/compiler --profile fuzz --test fuzz --run-ignored only --no-capture
      - name: Upload failing programs and their minimized forms
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fuzz-${{ matrix.os }}-attempt-${{ github.run_attempt }}
          path: target/fuzz
          if-no-files-found: ignore

  report:
    name: Report fuzz failures
    needs: fuzz
    if: ${{ always() && needs.fuzz.result == 'failure' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check the issue reporter
        run: python3 scripts/test_report_fuzz_failure.py
      - name: Open or update an issue for each failed runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/report-fuzz-failure.py
