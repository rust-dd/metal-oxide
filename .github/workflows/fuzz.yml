name: Fuzz
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: swiftc probe/compile.swift -o /tmp/metal-probe
      - run: |
          for source in probe/*.metal; do
            /tmp/metal-probe "$source" || true
          done
