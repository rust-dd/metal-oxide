name: Packaged installation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      METAL_OXIDE_BACKEND: classic
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Install host and minimum supported Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup toolchain install 1.89.0 --profile minimal
      - name: Package, install, author and consume saved kernels
        run: python3 scripts/check-release.py --smoke
