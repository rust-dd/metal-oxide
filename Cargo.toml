[workspace]
members = [
    "benchmarks/runner",
    "crates/cargo-metal",
    "crates/metal-oxide",
    "crates/metal-oxide-artifact",
    "crates/metal-oxide-build",
    "crates/metal-oxide-codegen",
    "crates/metal-oxide-compiler",
    "crates/metal-oxide-compiler/tests/crates/particle-device-math",
    "crates/metal-oxide-compiler/tests/crates/particle-update-kernels",
    "crates/metal-oxide-compiler/tests/crates/pipeline-device-math",
    "crates/metal-oxide-compiler/tests/crates/pipeline-kernels",
    "crates/metal-oxide-compiler/tests/crates/vec-add-kernels",
    "crates/metal-oxide-device",
    "crates/metal-oxide-ir",
    "crates/metal-oxide-kernels",
    "crates/metal-oxide-macros",
    "examples/cooperation/host",
    "examples/cooperation/kernels",
    "examples/matmul/host",
    "examples/matmul/kernels",
    "examples/particle-update",
    "examples/pipeline",
    "examples/reduction",
    "examples/saxpy",
    "examples/spectral/host",
    "examples/spectral/kernels",
    "examples/vec-add",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rust-dd/metal-oxide"
rust-version = "1.89"
version = "0.1.0-alpha.1"

[workspace.dependencies]
block2 = "0.6.2"
clap = { version = "4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
dispatch2 = "0.3.1"
half = { version = "2.7.1", default-features = false }
loom = "0.7.2"
metal-oxide = { path = "crates/metal-oxide", version = "=0.1.0-alpha.1" }
metal-oxide-artifact = { path = "crates/metal-oxide-artifact", version = "=0.1.0-alpha.1" }
metal-oxide-build = { path = "crates/metal-oxide-build", version = "=0.1.0-alpha.1" }
metal-oxide-codegen = { path = "crates/metal-oxide-codegen", version = "=0.1.0-alpha.1" }
metal-oxide-device = { path = "crates/metal-oxide-device", version = "=0.1.0-alpha.1" }
metal-oxide-ir = { path = "crates/metal-oxide-ir", version = "=0.1.0-alpha.1" }
metal-oxide-kernels = { path = "crates/metal-oxide-kernels", version = "=0.1.0-alpha.1" }
metal-oxide-macros = { path = "crates/metal-oxide-macros", version = "=0.1.0-alpha.1" }
miniz_oxide = "0.9.1"
# Metal's capture layer forwards messages that objc2's debug assertions reject as unknown.
objc2 = { version = "0.6.5", features = ["disable-encoding-assertions"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSObject", "NSString", "NSURL", "std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTL4ArgumentTable",
    "MTL4CommandAllocator",
    "MTL4CommandBuffer",
    "MTL4CommandEncoder",
    "MTL4CommandQueue",
    "MTL4CommitFeedback",
    "MTL4Compiler",
    "MTL4ComputeCommandEncoder",
    "MTL4ComputePipeline",
    "MTL4FunctionDescriptor",
    "MTL4LibraryFunctionDescriptor",
    "MTL4PipelineState",
    "MTLAllocation",
    "MTLBlitCommandEncoder",
    "MTLBuffer",
    "MTLCaptureManager",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLEvent",
    "MTLGPUAddress",
    "MTLLibrary",
    "MTLLogState",
    "MTLResidencySet",
    "MTLResource",
    "MTLTypes",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "std",
] }
particle-device-math = { path = "crates/metal-oxide-compiler/tests/crates/particle-device-math" }
particle-update = { path = "examples/particle-update" }
pipeline-device-math = { path = "crates/metal-oxide-compiler/tests/crates/pipeline-device-math" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "3.0.6", features = ["fold", "full", "visit"] }
tokio = { version = "1.53.2", default-features = false, features = ["macros", "rt", "rt-multi-thread", "time"] }
trybuild = "1.0.121"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(target_env, values("metal"))'] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
