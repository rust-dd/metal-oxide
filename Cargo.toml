[workspace]
members = [
    "crates/cargo-metal",
    "crates/metal-oxide",
    "examples/vec-add/host",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rust-dd/metal-oxide"
rust-version = "1.99"
version = "0.1.0-alpha.1"

[workspace.dependencies]
metal-oxide = { path = "crates/metal-oxide" }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSObject", "NSString", "NSURL", "std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes", "std"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

