[workspace]
members = [
    "crates/cargo-metal",
    "crates/metal-oxide",
    "crates/metal-oxide-artifact",
    "crates/metal-oxide-codegen",
    "crates/metal-oxide-compiler",
    "crates/metal-oxide-device",
    "crates/metal-oxide-ir",
    "crates/metal-oxide-macros",
    "examples/matmul/host",
    "examples/matmul/kernels",
    "examples/reduction/host",
    "examples/reduction/kernels",
    "examples/vec-add/host",
    "examples/vec-add/kernels",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rust-dd/metal-oxide"
rust-version = "1.99"
version = "0.1.0-alpha.1"

[workspace.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
metal-oxide = { path = "crates/metal-oxide" }
metal-oxide-artifact = { path = "crates/metal-oxide-artifact" }
metal-oxide-codegen = { path = "crates/metal-oxide-codegen" }
metal-oxide-device = { path = "crates/metal-oxide-device" }
metal-oxide-ir = { path = "crates/metal-oxide-ir" }
metal-oxide-macros = { path = "crates/metal-oxide-macros" }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSObject", "NSString", "NSURL", "std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLAllocation", "MTLBuffer", "MTLCommandBuffer", "MTLCommandEncoder", "MTLCommandQueue", "MTLComputeCommandEncoder", "MTLComputePipeline", "MTLDevice", "MTLLibrary", "MTLResource", "MTLTypes", "block2", "dispatch2", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("metal"))'] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
