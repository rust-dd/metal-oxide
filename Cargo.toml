[workspace]
members = [
    "crates/cargo-metal",
    "crates/metal-oxide",
    "crates/metal-oxide-artifact",
    "crates/metal-oxide-codegen",
    "crates/metal-oxide-compiler",
    "crates/metal-oxide-device",
    "crates/metal-oxide-ir",
    "crates/metal-oxide-macros",
    "examples/cooperation/host",
    "examples/cooperation/kernels",
    "examples/matmul/host",
    "examples/matmul/kernels",
    "examples/particle-update/device-math",
    "examples/particle-update/host",
    "examples/particle-update/kernels",
    "examples/pipeline/device-math",
    "examples/pipeline/host",
    "examples/pipeline/kernels",
    "examples/reduction/host",
    "examples/reduction/kernels",
    "examples/vec-add/host",
    "examples/vec-add/kernels",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rust-dd/metal-oxide"
rust-version = "1.99"
version = "0.1.0-alpha.1"

[workspace.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
half = { version = "2.7.1", default-features = false }
metal-oxide = { path = "crates/metal-oxide" }
metal-oxide-artifact = { path = "crates/metal-oxide-artifact" }
metal-oxide-codegen = { path = "crates/metal-oxide-codegen" }
metal-oxide-device = { path = "crates/metal-oxide-device" }
metal-oxide-ir = { path = "crates/metal-oxide-ir" }
metal-oxide-macros = { path = "crates/metal-oxide-macros" }
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSError", "NSObject", "NSString", "NSURL", "std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
    "MTL4ArgumentTable",
    "MTL4CommandAllocator",
    "MTL4CommandBuffer",
    "MTL4CommandEncoder",
    "MTL4CommandQueue",
    "MTL4CommitFeedback",
    "MTL4Compiler",
    "MTL4ComputeCommandEncoder",
    "MTL4ComputePipeline",
    "MTL4FunctionDescriptor",
    "MTL4LibraryFunctionDescriptor",
    "MTL4PipelineState",
    "MTLAllocation",
    "MTLBuffer",
    "MTLCommandBuffer",
    "MTLCommandEncoder",
    "MTLCommandQueue",
    "MTLComputeCommandEncoder",
    "MTLComputePipeline",
    "MTLDevice",
    "MTLGPUAddress",
    "MTLLibrary",
    "MTLResidencySet",
    "MTLResource",
    "MTLTypes",
    "block2",
    "dispatch2",
    "std",
] }
particle-device-math = { path = "examples/particle-update/device-math" }
pipeline-device-math = { path = "examples/pipeline/device-math" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_env, values("metal"))'] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
