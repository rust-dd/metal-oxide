<svg xmlns="http://www.w3.org/2000/svg" width="520" height="812" viewBox="0 0 520 812" role="img" aria-labelledby="title description">
  <title id="title">metal-oxide architecture</title>
  <desc id="description">Rust kernels compile through MIR and typed IR to MSL. The host loads the kernel artifact and runs it through the Metal runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle" fill="#24292f">
    <rect x="30" y="20" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="48" font-size="16" font-weight="600">Kernel crate (no_std)</text>
    <text x="260" y="72" font-size="14">metal-oxide-device + #[kernel]</text>
    <path d="M260 92V116" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="120" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="148" font-size="16" font-weight="600">rustc</text>
    <text x="260" y="172" font-size="14">Types + borrowing → MIR</text>
    <path d="M260 192V216" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="220" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="248" font-size="16" font-weight="600">metal-oxide-compiler</text>
    <text x="260" y="272" font-size="14">MIR importer → metal-oxide IR</text>
    <path d="M260 292V316" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="320" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="348" font-size="16" font-weight="600">metal-oxide-codegen</text>
    <text x="260" y="372" font-size="14">MSL + ABI + bindings.rs</text>
    <path d="M260 392V416" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="420" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="448" font-size="16" font-weight="600">Apple Metal compiler</text>
    <text x="260" y="472" font-size="14">MSL → kernels.metallib</text>
    <path d="M260 492V516" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="520" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="548" font-size="16" font-weight="600">Kernel artifact</text>
    <text x="260" y="572" font-size="14">.metallib + manifest.json + bindings.rs</text>
    <path d="M260 592V616" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="620" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="648" font-size="16" font-weight="600">Rust host + generated bindings</text>
    <text x="260" y="672" font-size="14">metal-oxide runtime</text>
    <path d="M260 692V716" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="30" y="720" width="460" height="72" rx="6" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
    <text x="260" y="748" font-size="16" font-weight="600">Metal / Metal 4</text>
    <text x="260" y="772" font-size="14">GPU</text>
  </g>
</svg>
