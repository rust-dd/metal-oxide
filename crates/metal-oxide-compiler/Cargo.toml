[package]
name = "metal-oxide-compiler"
categories = ["compilers"]
description = "Rust frontend for Metal compute kernels"
edition.workspace = true
keywords = ["compiler", "gpu", "metal", "msl", "rustc"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[package.metadata.rust-analyzer]
rustc_private = true

[features]
rustc-private = []

[dependencies]
metal-oxide-artifact = { workspace = true }
metal-oxide-codegen.workspace = true
metal-oxide-ir.workspace = true
serde_json.workspace = true

[dev-dependencies]
metal-oxide.workspace = true
metal-oxide-build.workspace = true
nostd-numeric-kernels.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
objc2-foundation.workspace = true
objc2-metal.workspace = true

[[bin]]
name = "metal-oxide-compiler"
path = "src/main.rs"
required-features = ["rustc-private"]

[[test]]
name = "frontend"
path = "tests/frontend.rs"
required-features = ["rustc-private"]

[[test]]
name = "ir"
path = "tests/ir.rs"
required-features = ["rustc-private"]

[[test]]
name = "gpu"
path = "tests/gpu.rs"
required-features = ["rustc-private"]

[[test]]
name = "msl"
path = "tests/msl.rs"
required-features = ["rustc-private"]

[[test]]
name = "cargo"
path = "tests/cargo.rs"
required-features = ["rustc-private"]

[lints]
workspace = true
