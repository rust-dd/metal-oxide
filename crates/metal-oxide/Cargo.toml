[package]
name = "metal-oxide"
categories = ["hardware-support", "os::macos-apis"]
description = "Metal compute runtime for Rust"
edition.workspace = true
keywords = ["apple", "compute", "gpgpu", "gpu", "metal"]
license.workspace = true
publish = false
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
block2 = { workspace = true }
dispatch2 = { workspace = true }
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true }

[dependencies]
half = { workspace = true }
metal-oxide-artifact = { workspace = true }

[target.'cfg(not(loom))'.dev-dependencies]
tokio = { workspace = true }

[target.'cfg(loom)'.dev-dependencies]
loom = { workspace = true }

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
targets = ["aarch64-apple-darwin"]

[lints]
workspace = true
